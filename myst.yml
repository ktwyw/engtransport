        - file: notebooks/part4_mass_transfer/15_diffusion_reaction.ipynb
        - file: notebooks/part4_mass_transfer/16_convective_mass_transfer.ipynb
        - file: notebooks/part4_mass_transfer/17_simultaneous_heat_mass.ipynb
